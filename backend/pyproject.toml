[project]
name = "kanser-backend"
version = "0.1.0"
description = "Multimodal Lung Cancer Agentic AI Diagnosis - FastAPI core"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-multipart>=0.0.12",
    "asyncpg>=0.30",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "cryptography>=43",
    "pyjwt>=2.9",
    "pydicom>=2.4",
    "langgraph>=0.4",
    "rank-bm25>=0.2",
    "chromadb>=1.0",
    "spacy>=3.7",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
laya = ["laya>=0.3"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
